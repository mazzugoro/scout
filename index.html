function queueDel(sheet,ids){S.pdel=S.pdel||[];[].concat(ids).forEach(i=>S.pdel.push({s:sheet,i}));try{save()}catch(e){}}
async function flushDel(mcp){
 const q=S.pdel||[];if(!q.length)return 0;let n=0;
 for(const sh of [...new Set(q.map(x=>x.s))]){
  const ids=q.filter(x=>x.s===sh).map(x=>x.i);
  await mcp.callTool(SRV,"delete_by_id",{spreadsheetId:SID,sheet:sh,ids});
  S.pdel=S.pdel.filter(x=>x.s!==sh);n+=ids.length;save()}
 return n}
